# ---------------------------------------------------------------------------
# Portable tmux config for CTF / Attack-Defence
# Prefix: C-b (default). Reload: prefix + r
# ---------------------------------------------------------------------------

# ---- terminal / session ----------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# tmux >= 3.2 only: set -ga terminal-features ",*:RGB"
set -g assume-paste-time 1
set -g escape-time 0
set -g focus-events on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -g detach-on-destroy off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
set -g monitor-activity on
setw -g monitor-activity on
set -g status-interval 5
set -g status-keys vi
setw -g mode-keys vi
set -g word-separators ' -_@'
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'
set -g status-position bottom
set -g display-panes-time 1000
set -g display-panes-colour colour244
set -g display-panes-active-colour colour51
set -g activity-action other
set -g silence-action other
set -g remain-on-exit off
set -g destroy-unattached off
set -g exit-empty on
setw -g automatic-rename off
set -g allow-rename off

# ---- prefix / navigation ---------------------------------------------------
set -g prefix C-b
bind C-b send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux: config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r '<' resize-pane -L 5
bind -r '>' resize-pane -R 5

# Vim-style window switching
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind Q confirm-before -p "kill session? (y/n)" kill-session
bind X confirm-before -p "kill window? (y/n)" kill-window

# ---- copy mode -------------------------------------------------------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- status bar ------------------------------------------------------------
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[fg=#89b4fa,bold] #S #[fg=#6c7086]| '
set -g status-right '#[fg=#f9e2af]#{?client_prefix,PREFIX ,}#[fg=#a6e3a1]%H:%M #[fg=#6c7086]| #[fg=#cba6f7]#H '
setw -g window-status-current-style 'fg=#1e1e2e bg=#89b4fa bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g message-style 'bg=#313244 fg=#cdd6f4'
set -g message-command-style 'bg=#313244 fg=#cdd6f4'
set -g mode-style 'bg=#f5c2e7 fg=#1e1e2e'
